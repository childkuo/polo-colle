<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026/12 新竹基金會 - 衣服尺寸線上統計</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-active: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    .container { max-width: 1024px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }

    /* 頂部同步狀態條 */
    .sync-bar { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .sync-status { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
    .dot.green { background: #22c55e; }
    .dot.yellow { background: #eab308; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    .app-header { background: white; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); }
    .app-title { font-size: 19px; font-weight: 800; color: #0f172a; }

    .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 6px; }

    /* 圖表區 */
    .charts-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 768px) { .charts-grid { grid-template-columns: 1fr 1fr; } }
    .chart-box { width: 100%; height: 280px; }

    /* 表單元件 */
    .form-label { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; display: block; }
    .input-text { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    .input-text:focus { border-color: var(--primary); }

    /* 加減計數器 (Stepper) */
    .stepper-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    @media (min-width: 600px) { .stepper-grid { grid-template-columns: repeat(4, 1fr); } }
    .stepper-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; }
    .size-tag { font-weight: 800; font-size: 14px; }
    .btn-step { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; font-size: 18px; font-weight: 700; cursor: pointer; }
    .btn-step:active { background: #e2e8f0; }
    .step-val { width: 28px; text-align: center; font-size: 15px; font-weight: 700; color: var(--primary); }

    .btn { height: 46px; border-radius: 8px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 1; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:disabled { background: #94a3b8; }
    .btn-secondary { background: #f1f5f9; color: #475569; flex: 0.4; }

    /* 手機卡片列表 */
    .roster-cards { display: flex; flex-direction: column; gap: 8px; }
    @media (min-width: 768px) { .roster-cards { display: none; } }
    .person-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .person-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; }
    .chip { font-size: 11px; font-weight: 700; background: #dbeafe; color: #1e40af; padding: 2px 7px; border-radius: 6px; }
    .notes-box { font-size: 11px; background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 6px; font-weight: 600; width: fit-content; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; }
    .btn-sm.del { color: var(--danger); border-color: #fecaca; }

    /* 電腦表格 */
    .roster-table-wrap { display: none; overflow-x: auto; }
    @media (min-width: 768px) { .roster-table-wrap { display: block; } }
    .desk-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    .desk-table th, .desk-table td { border: 1px solid var(--border); padding: 8px; }
    .desk-table th { background: #f8fafc; }

    /* 底部總計常駐列 */
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  </style>
</head>
<body>

<div class="container">

  <!-- 雲端同步狀態顯示條 -->
  <div class="sync-bar">
    <div class="sync-status">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">正在連線 Google 雲端試算表...</span>
    </div>
    <button class="btn-sm" onclick="loadFromCloud()">🔄 重新整理</button>
  </div>

  <div class="app-header">
    <h1 class="app-title">2026/12 新竹基金會 - 衣服尺寸線上統計</h1>
  </div>

  <!-- BI 圖表 -->
  <div class="charts-grid">
    <div class="card">
      <div class="card-title">🥧 圓餅圖 (各尺寸佔比)</div>
      <div id="pieChart" class="chart-box"></div>
    </div>
    <div class="card">
      <div class="card-title">🌹 南丁格爾玫瑰圖 (數量階梯)</div>
      <div id="roseChart" class="chart-box"></div>
    </div>
  </div>

  <!-- 輸入表單 -->
  <div class="card" id="formCard">
    <div class="card-title" id="formTitle">✏️ 登記與修改尺寸</div>
    <form id="orderForm" onsubmit="saveEntry(event)">
      <input type="hidden" id="editIndex" value="-1">
      <div style="margin-top: 8px;">
        <label class="form-label" for="name">人員姓名 / 單位代稱 *</label>
        <input type="text" id="name" class="input-text" placeholder="例如：鄭勝月、大舅" required>
      </div>

      <div style="margin-top: 10px;">
        <label class="form-label">選擇各尺寸件數</label>
        <div class="stepper-grid">
          <div class="stepper-item"><span class="size-tag">XS</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('xs', -1)">−</button><span class="step-val" id="disp_xs">0</span><button type="button" class="btn-step" onclick="changeQty('xs', 1)">+</button></div></div>
          <div class="stepper-item"><span class="size-tag">S</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('s', -1)">−</button><span class="step-val" id="disp_s">0</span><button type="button" class="btn-step" onclick="changeQty('s', 1)">+</button></div></div>
          <div class="stepper-item"><span class="size-tag">M</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('m', -1)">−</button><span class="step-val" id="disp_m">0</span><button type="button" class="btn-step" onclick="changeQty('m', 1)">+</button></div></div>
          <div class="stepper-item"><span class="size-tag">L</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('l', -1)">−</button><span class="step-val" id="disp_l">0</span><button type="button" class="btn-step" onclick="changeQty('l', 1)">+</button></div></div>
          <div class="stepper-item"><span class="size-tag">XL</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('xl', -1)">−</button><span class="step-val" id="disp_xl">0</span><button type="button" class="btn-step" onclick="changeQty('xl', 1)">+</button></div></div>
          <div class="stepper-item"><span class="size-tag">2L</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('l2', -1)">−</button><span class="step-val" id="disp_l2">0</span><button type="button" class="btn-step" onclick="changeQty('l2', 1)">+</button></div></div>
          <div class="stepper-item"><span class="size-tag">3L</span><div style="display:flex;align-items:center;"><button type="button" class="btn-step" onclick="changeQty('l3', -1)">−</button><span class="step-val" id="disp_l3">0</span><button type="button" class="btn-step" onclick="changeQty('l3', 1)">+</button></div></div>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label class="form-label" for="notes">備註說明 (選填)</label>
        <input type="text" id="notes" class="input-text" placeholder="例如：女款 L1 KL1">
      </div>

      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button type="submit" class="btn btn-primary" id="submitBtn">儲存並同步至雲端</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn" onclick="resetForm()" style="display:none;">取消</button>
      </div>
    </form>
  </div>

  <!-- 名冊 -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">📋 登記名冊明細 (<span id="peopleCount">0</span>人)</div>
      <button class="btn-sm" onclick="exportToCSV()">📥 匯出 Excel</button>
    </div>
    <!-- 手機卡片 -->
    <div class="roster-cards" id="mobileCards"></div>
    <!-- 電腦表格 -->
    <div class="roster-table-wrap">
      <table class="desk-table">
        <thead>
          <tr>
            <th>No</th><th>姓名</th><th>XS</th><th>S</th><th>M</th><th>L</th><th>XL</th><th>2L</th><th>3L</th>
            <th>小計</th><th>備註說明</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="desktopTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- 底部固定條 -->
<div class="bottom-bar">
  <div>
    <div style="font-size:17px;font-weight:800;color:var(--primary);">總計 <span id="statBottomTotal">0</span> 件</div>
    <div style="font-size:11px;color:var(--text-muted);" id="statBottomSummary">L:0 / XL:0...</div>
  </div>
  <button style="padding:8px 16px;background:var(--primary);color:white;border-radius:20px;border:none;font-weight:700;" onclick="scrollToForm()">＋ 立即登記</button>
</div>

<script>
// ⭐ 請將此處替換為您在第一步取得的 Google Apps Script 網頁應用程式網址：
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

// 備用初始名單
const defaultData = [
  { name: "大舅", xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "大阿姨", xs: 0, s: 0, m: 0, l: 1, xl: 2, l2: 0, l3: 0, notes: "L1 KL1" },
  { name: "二阿姨", xs: 0, s: 0, m: 0, l: 0, xl: 2, l2: 1, l3: 4, notes: "XS1 M1 S2" },
  { name: "鄭美月", xs: 0, s: 0, m: 0, l: 1, xl: 0, l2: 0, l3: 0, notes: "M1" },
  { name: "鄭滿月", xs: 0, s: 0, m: 0, l: 1, xl: 1, l2: 0, l3: 0, notes: "M1 XS2" },
  { name: "鄭渭月", xs: 2, s: 3, m: 2, l: 1, xl: 3, l2: 1, l3: 0, notes: "" },
  { name: "鄭綺月", xs: 0, s: 2, m: 0, l: 3, xl: 0, l2: 2, l3: 0, notes: "L2 S1" },
  { name: "湯立雄", xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "鄭榮林", xs: 0, s: 0, m: 0, l: 0, xl: 1, l2: 0, l3: 0, notes: "" },
  { name: "黃家榮", xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "吳志雄", xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "王春光", xs: 0, s: 0, m: 0, l: 1, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "楊建德", xs: 0, s: 0, m: 1, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "蔡彥平", xs: 0, s: 0, m: 0, l: 0, xl: 1, l2: 0, l3: 0, notes: "M1" },
  { name: "吳寶吉", xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "蔡裕谷", xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "鄭謝錦", xs: 0, s: 1, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "楊麗娥", xs: 0, s: 0, m: 0, l: 1, xl: 0, l2: 0, l3: 0, notes: "" },
  { name: "鄭錦碧", xs: 0, s: 0, m: 2, l: 7, xl: 0, l2: 2, l3: 1, notes: "" },
  { name: "台北",   xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0, notes: "" }
];

let records = JSON.parse(localStorage.getItem("polo_backup")) || defaultData;
let formSizes = { xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0 };

const pieChart = echarts.init(document.getElementById('pieChart'));
const roseChart = echarts.init(document.getElementById('roseChart'));
const colors = ['#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];

function setSyncStatus(state, msg) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  dot.className = "dot " + (state === "ok" ? "green" : state === "syncing" ? "yellow" : "");
  txt.innerText = msg;
}

// 從 Google 試算表載入最新資料
async function loadFromCloud() {
  if (GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_ID")) {
    setSyncStatus("fail", "尚未設定 Google Apps Script 網址 (目前使用本機模式)");
    render();
    return;
  }
  setSyncStatus("syncing", "正在同步 Google 雲端資料...");
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL);
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      records = data.map(item => ({
        name: item.name || "",
        xs: Number(item.xs) || 0,
        s: Number(item.s) || 0,
        m: Number(item.m) || 0,
        l: Number(item.l) || 0,
        xl: Number(item.xl) || 0,
        l2: Number(item.l2) || 0,
        l3: Number(item.l3) || 0,
        notes: item.notes || ""
      }));
      localStorage.setItem("polo_backup", JSON.stringify(records));
      setSyncStatus("ok", "🟢 已成功連線 Google 試算表（最新）");
    } else {
      // 雲端試算表尚無資料，把預設資料存上去
      await syncToCloud();
    }
  } catch (err) {
    console.error(err);
    setSyncStatus("fail", "連線失敗，使用離線快取資料");
  }
  render();
}

// 寫入 Google 試算表
async function syncToCloud() {
  if (GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_ID")) {
    localStorage.setItem("polo_backup", JSON.stringify(records));
    return;
  }
  setSyncStatus("syncing", "正在寫入 Google 雲端試算表...");
  document.getElementById("submitBtn").disabled = true;
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(records)
    });
    localStorage.setItem("polo_backup", JSON.stringify(records));
    setSyncStatus("ok", "🟢 已儲存並同步至 Google 試算表");
  } catch (err) {
    alert("雲端同步異常，請檢查網路連線");
    setSyncStatus("fail", "同步失敗");
  } finally {
    document.getElementById("submitBtn").disabled = false;
  }
}

function changeQty(key, delta) {
  formSizes[key] = Math.max(0, formSizes[key] + delta);
  document.getElementById(`disp_${key}`).innerText = formSizes[key];
}

function setFormQty(key, val) {
  formSizes[key] = Math.max(0, val || 0);
  document.getElementById(`disp_${key}`).innerText = formSizes[key];
}

function updateCharts(stats) {
  const chartData = [
    { name: 'XS', value: stats.xs },
    { name: 'S',  value: stats.s },
    { name: 'M',  value: stats.m },
    { name: 'L',  value: stats.l },
    { name: 'XL', value: stats.xl },
    { name: '2L', value: stats.l2 },
    { name: '3L', value: stats.l3 }
  ].filter(d => d.value > 0);

  pieChart.setOption({
    color: colors,
    tooltip: { trigger: 'item', formatter: '{b}: {c}件 ({d}%)' },
    series: [{
      type: 'pie',
      radius: ['32%', '65%'],
      label: { show: true, formatter: '{b}: {c}件\n({d}%)', fontSize: 11, fontWeight: 'bold' },
      data: chartData
    }]
  });

  roseChart.setOption({
    color: colors,
    tooltip: { trigger: 'item', formatter: '{b}: {c}件' },
    series: [{
      type: 'pie',
      radius: ['18%', '68%'],
      roseType: 'radius',
      label: { show: true, formatter: '{b}\n{c}件', fontSize: 11, fontWeight: 'bold' },
      data: chartData
    }]
  });
}

function render() {
  const mobileContainer = document.getElementById("mobileCards");
  const deskTbody = document.getElementById("desktopTableBody");
  mobileContainer.innerHTML = "";
  deskTbody.innerHTML = "";

  let totalCount = 0;
  let stats = { xs: 0, s: 0, m: 0, l: 0, xl: 0, l2: 0, l3: 0 };

  records.forEach((row, idx) => {
    const rowTotal = (row.xs||0)+(row.s||0)+(row.m||0)+(row.l||0)+(row.xl||0)+(row.l2||0)+(row.l3||0);
    totalCount += rowTotal;

    stats.xs += (row.xs || 0);
    stats.s  += (row.s  || 0);
    stats.m  += (row.m  || 0);
    stats.l  += (row.l  || 0);
    stats.xl += (row.xl || 0);
    stats.l2 += (row.l2 || 0);
    stats.l3 += (row.l3 || 0);

    // 手機卡片
    let chips = "";
    ['xs','s','m','l','xl','l2','l3'].forEach((k, i) => {
      const lbl = ['XS','S','M','L','XL','2L','3L'][i];
      if (row[k] > 0) chips += `<span class="chip">${lbl}: ${row[k]}</span> `;
    });

    const card = document.createElement("div");
    card.className = "person-card";
    card.innerHTML = `
      <div class="person-top">
        <span>${idx + 1}. ${escapeHtml(row.name)}</span>
        <span style="color:var(--primary); font-size:13px;">${rowTotal > 0 ? `共 ${rowTotal} 件` : '未登記'}</span>
      </div>
      <div>${chips || '<span style="color:#94a3b8;font-size:12px;">無尺寸資料</span>'}</div>
      ${row.notes ? `<div class="notes-box">備註：${escapeHtml(row.notes)}</div>` : ''}
      <div class="actions">
        <button class="btn-sm" onclick="editRow(${idx})">✏️ 修改</button>
        <button class="btn-sm del" onclick="deleteRow(${idx})">🗑️ 刪除</button>
      </div>
    `;
    mobileContainer.appendChild(card);

    // 電腦表格
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td style="font-weight:700;">${escapeHtml(row.name)}</td>
      <td>${row.xs || "-"}</td><td>${row.s || "-"}</td><td>${row.m || "-"}</td>
      <td>${row.l || "-"}</td><td>${row.xl || "-"}</td><td>${row.l2 || "-"}</td><td>${row.l3 || "-"}</td>
      <td style="font-weight:800; color:var(--primary);">${rowTotal || "-"}</td>
      <td>${row.notes ? `<span class="notes-box">${escapeHtml(row.notes)}</span>` : ""}</td>
      <td>
        <button class="btn-sm" onclick="editRow(${idx})">修改</button>
        <button class="btn-sm del" onclick="deleteRow(${idx})">刪除</button>
      </td>
    `;
    deskTbody.appendChild(tr);
  });

  document.getElementById("statBottomTotal").innerText = totalCount;
  document.getElementById("statBottomSummary").innerText = `L:${stats.l} / XL:${stats.xl} / M:${stats.m} / 2L:${stats.l2}`;
  document.getElementById("peopleCount").innerText = records.length;

  updateCharts(stats);
}

async function saveEntry(e) {
  e.preventDefault();
  const editIdx = parseInt(document.getElementById("editIndex").value);

  const entry = {
    name: document.getElementById("name").value.trim(),
    xs: formSizes.xs, s: formSizes.s, m: formSizes.m, l: formSizes.l,
    xl: formSizes.xl, l2: formSizes.l2, l3: formSizes.l3,
    notes: document.getElementById("notes").value.trim()
  };

  if (editIdx >= 0) {
    records[editIdx] = entry;
  } else {
    records.unshift(entry);
  }

  render();
  resetForm();
  await syncToCloud();
}

function editRow(index) {
  const row = records[index];
  document.getElementById("editIndex").value = index;
  document.getElementById("name").value = row.name;
  document.getElementById("notes").value = row.notes || "";
  ['xs','s','m','l','xl','l2','l3'].forEach(k => setFormQty(k, row[k]));

  document.getElementById("formTitle").innerText = `✏️ 正在修改：${row.name}`;
  document.getElementById("submitBtn").innerText = "確認修改並同步";
  document.getElementById("cancelBtn").style.display = "block";
  scrollToForm();
}

function resetForm() {
  document.getElementById("orderForm").reset();
  document.getElementById("editIndex").value = -1;
  document.getElementById("formTitle").innerText = "✏️ 登記與修改尺寸";
  document.getElementById("submitBtn").innerText = "儲存並同步至雲端";
  document.getElementById("cancelBtn").style.display = "none";
  ['xs','s','m','l','xl','l2','l3'].forEach(k => setFormQty(k, 0));
}

async function deleteRow(index) {
  if (confirm(`確定要刪除「${records[index].name}」嗎？此動作將同步至雲端。`)) {
    records.splice(index, 1);
    render();
    await syncToCloud();
  }
}

function scrollToForm() {
  document.getElementById("formCard").scrollIntoView({ behavior: "smooth" });
  document.getElementById("name").focus();
}

function exportToCSV() {
  let csv = "\uFEFFNo,姓名,XS,S,M,L,XL,2L,3L,小計,備註說明\n";
  records.forEach((r, idx) => {
    const total = (r.xs||0)+(r.s||0)+(r.m||0)+(r.l||0)+(r.xl||0)+(r.l2||0)+(r.l3||0);
    csv += `${idx + 1},"${r.name.replace(/"/g, '""')}",${r.xs||0},${r.s||0},${r.m||0},${r.l||0},${r.xl||0},${r.l2||0},${r.l3||0},${total},"${(r.notes||"").replace(/"/g, '""')}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `2026_12_新竹基金會_衣服尺寸統計表.csv`;
  link.click();
}

function escapeHtml(text) {
  return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

window.addEventListener('resize', () => {
  pieChart.resize();
  roseChart.resize();
});

// 開啟網頁時自動抓取 Google 雲端試算表
loadFromCloud();
</script>
